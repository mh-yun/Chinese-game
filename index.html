<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>字字珠機 - iPad攤位解謎遊戲 (120秒/2題版)</title>
  <style>
    :root {
      --primary-grad: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --accent-color: #ef4444;
      --gold-grad: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #1f2937;
      --cell-size: 88px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--primary-grad);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow: hidden;
    }

    .game-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 900px;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-height: 620px;
      justify-content: space-between;
    }

    /* 頂部資訊列 */
    .header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .pill-badge {
      background: #2563eb;
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .player-tag {
      background: #f3f4f6;
      color: #374151;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid #d1d5db;
    }

    .timer-display {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-color);
      background: #fef2f2;
      padding: 5px 18px;
      border-radius: 20px;
      border: 2px solid var(--accent-color);
    }

    .score-display {
      font-size: 1.25rem;
      font-weight: 800;
      color: #10b981;
    }

    /* 進度條 */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #e5e7eb;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      transition: width 0.1s linear;
    }

    /* 十字型 5 格盤面 */
    .cross-grid {
      display: grid;
      grid-template-columns: repeat(3, var(--cell-size));
      grid-template-rows: repeat(3, var(--cell-size));
      gap: 12px;
      margin: 12px 0 20px 0;
      justify-content: center;
      align-content: center;
    }

    .grid-cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: all 0.2s ease;
    }

    .cell-top    { grid-column: 2; grid-row: 1; }
    .cell-left   { grid-column: 1; grid-row: 2; }
    .cell-center { grid-column: 2; grid-row: 2; }
    .cell-right  { grid-column: 3; grid-row: 2; }
    .cell-bottom { grid-column: 2; grid-row: 3; }

    .grid-cell.center-node {
      background: var(--gold-grad);
      color: #ffffff;
      border: 3px solid #b45309;
      box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35);
      font-size: 2.5rem;
      font-weight: 800;
    }

    /* 輸入框樣式 */
    .char-input {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: #f9fafb;
      border: 3px dashed #d1d5db;
      color: #1d4ed8;
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      caret-color: #2563eb;
      transition: all 0
